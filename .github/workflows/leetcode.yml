name: Update LeetCode card
on:
  schedule: [{cron: "0 6 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/leetcode_card.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add assets/leetcode.svg
          git diff --staged --quiet || git commit -m "Update LeetCode card" && git push
